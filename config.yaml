llm:
  model: gemma4:e4b
  temperature: 0.2
  top_p: 0.9
  stop:
    - "PAUSE"
    - "Observation:"

agent:
  max_steps: 10

tools:
  timeout: 15

context:
  context_window_tokens: 16384    # Must match the context length Ollama actually loads (num_ctx), not the model's maximum
  max_output_tokens: 2048         # Tokens reserved for the model's response (thinking models need headroom)
  safety_margin_tokens: 256       # Extra room for estimation errors and formatting overhead
  summary_trigger_ratio: 0.8      # Start considering compaction at 80% of the available input budget
  recent_turns: 2                 # Number of recent user turns to preserve outside the summary
  summary_chunk_tokens: 3000      # Approximate size of each batch of older messages sent for summarization
  summary_max_tokens: 1200        # Maximum estimated size of the stored summary
  summary_output_tokens: 2048     # Maximum tokens requested for each summarization or compression response